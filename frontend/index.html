<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>МОТИВ - Форма аварии</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: none;">

    <nav class="navbar">
        <div class="nav-logo">МОТИВ</div>
        <div class="nav-user">
            <span id="user-name">-</span>
            <button class="btn btn-secondary" onclick="logout()">Выход</button>
        </div>
    </nav>

    <div class="layout">
        <aside class="sidebar">
            <a href="index.html" class="active">Аварии</a>
            <a href="reports.html">Отчетность</a>
        </aside>

        <main class="main-content">
            <div class="page-title">Регистрация аварии</div>

            <form class="alarm-form" id="alarmForm">
                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group">
                            <label>Номер NTT/PW</label>
                            <input type="text" id="pw" required>
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group">
                            <label>Направление</label>
                            <select id="napr">
                                <option value="СВН">СВН</option>
                                <option value="ЮЗН">ЮЗН</option>
                                <option value="ХМЯН">ХМЯН</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group">
                            <label>ТЦ</label>
                            <select id="tehc">
                                <option value="АСБ">АСБ</option>
                                <option value="ЕКБ">ЕКБ</option>
                                <option value="ИРБ">ИРБ</option>
                                <option value="КРТ">КРТ</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group">
                            <label>Категория</label>
                            <select id="kateg">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group">
                            <label>Тип сети</label>
                            <select id="netw_type">
                                <option value="GSM">GSM</option>
                                <option value="LTE">LTE</option>
                                <option value="LTE/GSM">LTE/GSM</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-col-3">
                        <div class="form-group">
                            <label>Сетевой элемент, услуга</label>
                            <input type="text" id="serv_elem">
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group">
                            <label>Количество БС</label>
                            <input type="number" id="numb_rbs" min="0" max="10000" value="1">
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group">
                            <label>Тип оборудования</label>
                            <input type="text" id="eqip_type">
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group">
                            <label>Тип аварии</label>
                            <select id="alarm_type">
                                <option value="РРС">РРС</option>
                                <option value="ЭЛ">ЭЛ</option>
                                <option value="RBS">RBS</option>
                                <option value="ТМ">ТМ</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-col-3">
                        <div class="form-group">
                            <label>Описание аварии</label>
                            <input type="text" id="descr">
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group">
                            <label>Начало</label>
                            <input type="datetime-local" id="begin_time" required>
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group">
                            <label>Окончание</label>
                            <input type="datetime-local" id="end_time">
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="checkbox-group">
                            <input type="checkbox" id="is_nv" onchange="toggleNV()">
                            <label for="is_nv">НВ (Настоящее время)</label>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group">
                            <label>АКБ (чч:мм:сс)</label>
                            <input type="time" step="1" id="akb">
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group">
                            <label>ГУ (чч:мм:сс)</label>
                            <input type="time" step="1" id="dgu">
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group">
                            <label>Длительность аварии</label>
                            <input type="text" id="lenght" readonly style="background: #222; color: #fff;">
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group">
                            <label>Время перерыва связи</label>
                            <input type="time" step="1" id="prostoy">
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="form-group">
                            <label>Общее время простоя БС</label>
                            <input type="text" id="common_prostoy" readonly style="background: #222; color: #fff;">
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group">
                            <label>Уведомление (Кому)</label>
                            <input type="text" id="alarm_who">
                        </div>
                    </div>
                    <div class="form-col-3">
                        <div class="form-group">
                            <label>Подробное примечание</label>
                            <textarea id="desc_notice" rows="2"></textarea>
                        </div>
                    </div>
                </div>

                <div style="margin-top: 15px;">
                    <button type="button" class="btn" onclick="saveAlarm()">Сохранить</button>
                </div>
            </form>
        </main>
    </div>

    <script>
        if (!localStorage.getItem('motiv_user')) {
            window.location.href = 'login.html';
        } else {
            document.body.style.display = 'block';
            var user = JSON.parse(localStorage.getItem('motiv_user'));
            document.getElementById('user-name').innerText = user.username;
        }

        function logout() {
            localStorage.removeItem('motiv_user');
            window.location.href = 'login.html';
        }

        function toggleNV() {
            var isNV = document.getElementById('is_nv').checked;
            document.getElementById('end_time').disabled = isNV;
            calculateDuration();
        }

        function formatTime(ms) {
            var totalSeconds = Math.floor(ms / 1000);
            var hours = Math.floor(totalSeconds / 3600);
            var minutes = Math.floor((totalSeconds % 3600) / 60);
            var seconds = totalSeconds % 60;
            return hours + ':' + (minutes < 10 ? '0' : '') + minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
        }

        function calculateDuration() {
            var beginVal = document.getElementById('begin_time').value;
            if (!beginVal) return;

            var begin = new Date(beginVal).getTime();
            var end;
            var isNV = document.getElementById('is_nv').checked;

            if (isNV) {
                end = new Date().getTime();
            } else {
                var endVal = document.getElementById('end_time').value;
                if (!endVal) return;
                end = new Date(endVal).getTime();
            }

            var diff = end - begin;
            if (diff < 0) diff = 0;

            document.getElementById('lenght').value = formatTime(diff);
            calculateCommon();
        }

        function calculateCommon() {
            var prostoyVal = document.getElementById('prostoy').value;
            var numRbs = parseInt(document.getElementById('numb_rbs').value) || 0;

            if (!prostoyVal) {
                document.getElementById('common_prostoy').value = '0:00:00';
                return;
            }

            var parts = prostoyVal.split(':');
            var seconds = (parseInt(parts[0]) * 3600) + (parseInt(parts[1]) * 60) + parseInt(parts[2] || 0);
            var total = seconds * numRbs;

            document.getElementById('common_prostoy').value = formatTime(total * 1000);
        }

        document.getElementById('begin_time').addEventListener('change', calculateDuration);
        document.getElementById('end_time').addEventListener('change', calculateDuration);
        document.getElementById('prostoy').addEventListener('change', calculateCommon);
        document.getElementById('numb_rbs').addEventListener('input', calculateCommon);

        setInterval(function() {
            if (document.getElementById('is_nv').checked) {
                calculateDuration();
            }
        }, 1000);

        function saveAlarm() {
            var data = {
                id: Date.now(),
                pw: document.getElementById('pw').value,
                napr: document.getElementById('napr').value,
                tehc: document.getElementById('tehc').value,
                kateg: document.getElementById('kateg').value,
                netw_type: document.getElementById('netw_type').value,
                serv_elem: document.getElementById('serv_elem').value,
                numb_rbs: document.getElementById('numb_rbs').value,
                eqip_type: document.getElementById('eqip_type').value,
                alarm_type: document.getElementById('alarm_type').value,
                descr: document.getElementById('descr').value,
                begin_time: document.getElementById('begin_time').value,
                end_time: document.getElementById('is_nv').checked ? 'НВ' : document.getElementById('end_time').value,
                akb: document.getElementById('akb').value,
                dgu: document.getElementById('dgu').value,
                lenght: document.getElementById('lenght').value,
                prostoy: document.getElementById('prostoy').value,
                common_prostoy: document.getElementById('common_prostoy').value,
                alarm_who: document.getElementById('alarm_who').value,
                desc_notice: document.getElementById('desc_notice').value
            };

            if (!data.pw || !data.begin_time) {
                alert('Заполните обязательные поля (PW и Начало)');
                return;
            }

            var alarms = JSON.parse(localStorage.getItem('motiv_alarms') || '[]');
            alarms.push(data);
            localStorage.setItem('motiv_alarms', JSON.stringify(alarms));

            alert('Авария сохранена!');
            document.getElementById('alarmForm').reset();
            document.getElementById('lenght').value = '';
            document.getElementById('common_prostoy').value = '';
        }
    </script>
</body>
</html>
