<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Аварии — Мотив</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="style.css?v=16">
    <script src="app.js?v=16"></script>
    <script src="form.js?v=16"></script>
</head>
<body class="app">
    <main class="page">
        <div class="page-head">
            <div>
                <h1>Аварии</h1>
                <div class="page-sub" id="sub"></div>
            </div>
        </div>

        <div class="split">
            <section class="panel">
                <div class="panel-head">
                    <div class="panel-title" id="form-title">Новая авария</div>
                    <button class="btn btn-sm can-edit" id="copy-last" title="Подставить поля из последней аварии">Как прошлая</button>
                </div>
                <div id="form-box"></div>
                <div class="empty" id="readonly-note" hidden>
                    Режим просмотра: инженер видит журнал и выгружает отчёты, но не вносит аварии.<br>
                    <a href="reports.html" class="btn" style="margin-top:12px">Открыть отчётность</a>
                </div>
            </section>

            <aside class="panel">
                <div class="panel-head">
                    <div class="panel-title">Не закрыты <small id="open-count"></small></div>
                    <a href="reports.html" class="btn btn-sm">Весь журнал</a>
                </div>
                <ul class="open-list" id="open-list"><li class="empty">Загрузка…</li></ul>
            </aside>
        </div>
    </main>

    <script>
        var M = Motiv, session = M.initPage('index.html');
        var form, openAlarms = [];

        function renderOpen() {
            var list = document.getElementById('open-list');
            document.getElementById('open-count').textContent = openAlarms.length ? openAlarms.length : '';
            document.getElementById('sub').textContent = 'Не закрыто аварий: ' + openAlarms.length;
            if (!openAlarms.length) {
                list.innerHTML = '<li class="empty">Незакрытых аварий нет</li>';
                return;
            }
            list.innerHTML = openAlarms.map(function (a) {
                return '<li class="open-item k-' + (a.KATEG || 3) + '">' +
                    '<div class="open-top"><b>' + M.esc(a.TEHC || '—') + ' · ' + M.esc(a.ALARM_TYPE || 'без типа') + '</b>' +
                    '<span class="open-timer" data-begin="' + a.BEGIN_TIME + '"></span></div>' +
                    '<div>' + M.esc(a.DESCR || '') + '</div>' +
                    '<div class="open-meta">' + M.esc(a.SERV_ELEM || '') + '</div>' +
                    '<div class="open-meta">№ ' + a.ID + ' · с ' + M.fmtDateTime(a.BEGIN_TIME) +
                    (a.KATEG ? ' · кат. ' + a.KATEG : '') + (a.NUMB_RBS === 0 ? ' · сектор' : a.NUMB_RBS ? ' · БС: ' + a.NUMB_RBS : '') + '</div>' +
                    '<div class="open-actions">' +
                    '<span class="can-edit"><button class="btn btn-sm btn-primary" data-close="' + a.ID + '">Закрыть сейчас</button>' +
                    '<button class="btn btn-sm" data-edit="' + a.ID + '">Изменить</button></span>' +
                    '<a class="btn btn-sm" href="reports.html?view=' + a.ID + '">Просмотр</a></div>' +
                    '</li>';
            }).join('');
            tickTimers();
        }

        function tickTimers() {
            Array.prototype.forEach.call(document.querySelectorAll('.open-timer'), function (el) {
                el.textContent = M.hms((new Date() - M.parseLocal(el.getAttribute('data-begin'))) / 1000);
            });
        }

        function loadOpen() {
            return M.api('GET', '/alarms?only_open=true').then(function (rows) {
                openAlarms = rows;
                renderOpen();
            }).catch(function (e) { M.toast(e.message, 'error'); });
        }

        document.getElementById('open-list').onclick = function (e) {
            var t = e.target, id;
            if ((id = t.getAttribute('data-close'))) {
                if (!confirm('Закрыть аварию № ' + id + '? Окончание = текущее время.')) return;
                t.disabled = true;
                M.api('POST', '/alarms/' + id + '/close').then(function (a) {
                    M.toast('Авария № ' + id + ' закрыта, длительность ' + a.LENGHT);
                    loadOpen();
                }).catch(function (x) { M.toast(x.message, 'error'); t.disabled = false; });
            }
            if ((id = t.getAttribute('data-edit'))) {
                M.api('GET', '/alarms/' + id).then(function (a) {
                    form.fill(a);
                    document.getElementById('form-title').textContent = 'Авария № ' + a.ID + ' — изменение';
                    window.scrollTo(0, 0);
                });
            }
        };

        if (session) {
            if (M.can('edit')) {
                form = AlarmForm.create(document.getElementById('form-box'), {
                    onSaved: function () {
                        document.getElementById('form-title').textContent = 'Новая авария';
                        form.reset();
                        loadOpen();
                    },
                    onCancel: function () {
                        document.getElementById('form-title').textContent = 'Новая авария';
                        form.reset();
                    }
                });
                document.getElementById('copy-last').onclick = function () {
                    M.api('GET', '/alarms?limit=1').then(function (rows) {
                        if (!rows.length) return;
                        var a = rows[0], copy = {};
                        ['PW', 'NAPR', 'TEHC', 'KATEG', 'NETW_TYPE', 'SERV_ELEM', 'NUMB_RBS', 'EQIP_TYPE', 'ALARM_TYPE',
                         'DESCR', 'PROSTOY', 'ALARM_WHO'].forEach(function (f) { copy[f] = a[f]; });
                        copy.PW = '';
                        form.fill(copy);
                        document.getElementById('form-title').textContent = 'Новая авария (по образцу № ' + a.ID + ')';
                    });
                };
            } else {
                document.getElementById('readonly-note').hidden = false;
            }
            loadOpen();
            setInterval(tickTimers, 1000);
            setInterval(loadOpen, 30000);
        }
    </script>
</body>
</html>
