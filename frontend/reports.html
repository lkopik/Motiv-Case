<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Отчётность — МОТИВ · Веб-отчётность</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css?v=6">
    <script src="app.js?v=6"></script>
    <script src="form.js?v=6"></script>
</head>
<body class="app">
    <main class="page">
        <div class="page-head">
            <div>
                <h1>Отчётность</h1>
                <div class="page-sub" id="sub">События за выбранный период. Нажмите на строку, чтобы открыть аварию.</div>
            </div>
            <div class="actions">
                <button class="btn btn-primary" id="csv">Выгрузить CSV</button>
            </div>
        </div>

        <section class="panel">
            <div class="filters">
                <div class="f auto"><span>Период</span>
                    <div class="quick" id="quick">
                        <button data-p="today">Сегодня</button><button data-p="yesterday">Вчера</button>
                        <button data-p="week">7 дней</button><button data-p="month">Месяц</button><button data-p="all">Всё</button>
                    </div>
                </div>
                <label class="f"><span>С</span><input type="date" id="from"></label>
                <label class="f"><span>По</span><input type="date" id="to"></label>
                <label class="f"><span>Направление</span><select id="napr"></select></label>
                <label class="f"><span>ТЦ</span><select id="tehc"></select></label>
                <label class="f"><span>Тип</span><select id="type"></select></label>
                <label class="f wide"><span>Поиск</span><input type="search" id="q" placeholder="PW, адрес, оборудование, текст"></label>
                <label class="check" style="height:34px"><input type="checkbox" id="open"> только НВ</label>
            </div>
            <div class="table-wrap">
                <table class="report-table">
                    <thead><tr>
                        <th class="num">№</th><th>PW/NTT</th><th>Напр.</th><th>ТЦ</th><th>Кат.</th><th>Сеть</th>
                        <th>Сетевой элемент</th><th class="num">БС</th><th>Оборудование</th><th>Тип</th><th>Описание</th>
                        <th>Начало</th><th>Окончание</th><th>АКБ</th><th>ГУ</th><th>Длительность</th>
                        <th>Перерыв</th><th>Общий простой</th><th>Кому</th><th>Подробно</th><th>Внёс</th>
                    </tr></thead>
                    <tbody id="rows"><tr><td colspan="21" class="empty">Загрузка…</td></tr></tbody>
                    <tfoot id="foot"></tfoot>
                </table>
            </div>
        </section>
    </main>

    <div class="modal" id="modal" hidden>
        <div class="modal-box">
            <div class="modal-head">
                <h2 id="modal-title">Авария</h2>
                <div>
                    <button class="btn btn-sm btn-danger can-admin" id="delete">Удалить</button>
                    <button class="modal-x" id="modal-x" title="Закрыть">×</button>
                </div>
            </div>
            <div id="modal-form"></div>
        </div>
    </div>

    <script>
        var M = Motiv, session = M.initPage('reports.html');
        var rows = [], form, openedId = null;

        function setPeriod(p) {
            var now = new Date(), from = new Date(now), to = new Date(now);
            if (p === 'yesterday') { from.setDate(now.getDate() - 1); to.setDate(now.getDate() - 1); }
            if (p === 'week') from.setDate(now.getDate() - 6);
            if (p === 'month') from.setDate(1);
            document.getElementById('from').value = p === 'all' ? '' : M.isoDate(from);
            document.getElementById('to').value = p === 'all' ? '' : M.isoDate(to);
            markQuick(p);
            load();
        }
        function markQuick(p) {
            Array.prototype.forEach.call(document.querySelectorAll('#quick button'), function (b) {
                b.className = b.getAttribute('data-p') === p ? 'active' : '';
            });
        }

        function query() {
            var params = [], map = { date_from: 'from', date_to: 'to', napr: 'napr', tehc: 'tehc', alarm_type: 'type', q: 'q' };
            Object.keys(map).forEach(function (k) {
                var v = document.getElementById(map[k]).value.trim();
                if (v) params.push(k + '=' + encodeURIComponent(v));
            });
            if (document.getElementById('open').checked) params.push('only_open=true');
            return params.join('&');
        }

        function cell(v, cls) { return '<td' + (cls ? ' class="' + cls + '"' : '') + ' title="' + M.esc(v) + '">' + M.esc(v) + '</td>'; }

        function render() {
            var tbody = document.getElementById('rows');
            if (!rows.length) {
                tbody.innerHTML = '<tr><td colspan="21" class="empty">За этот период аварий нет</td></tr>';
                document.getElementById('foot').innerHTML = '';
                return;
            }
            var totalSec = 0, open = 0;
            tbody.innerHTML = rows.map(function (a) {
                totalSec += M.toSec(a.COMMON_PROSTOY);
                if (a.IS_OPEN) open++;
                return '<tr class="clickable" data-id="' + a.ID + '">' +
                    '<td class="num muted">' + a.ID + '</td>' + cell(a.PW, 'nowrap') + cell(a.NAPR, 'nowrap') + cell(a.TEHC) +
                    '<td>' + (a.KATEG ? '<span class="kat kat-' + a.KATEG + '">' + a.KATEG + '</span>' : '') + '</td>' +
                    cell(a.NETW_TYPE, 'nowrap') + cell(a.SERV_ELEM, 'cut') +
                    '<td class="num">' + (a.NUMB_RBS === 0 ? 'С' : M.esc(a.NUMB_RBS)) + '</td>' +
                    cell(a.EQIP_TYPE, 'cut') + cell(a.ALARM_TYPE) + cell(a.DESCR, 'cut') +
                    '<td class="mono">' + M.fmtDateTime(a.BEGIN_TIME) + '</td>' +
                    '<td class="mono">' + (a.IS_OPEN ? '<span class="nv-badge">НВ</span>' : M.fmtDateTime(a.END_TIME)) + '</td>' +
                    cell(a.AKB, 'mono') + cell(a.DGU, 'mono') +
                    '<td class="mono"' + (a.IS_OPEN ? ' style="color:var(--red)"' : '') + '>' + M.esc(a.LENGHT) + '</td>' +
                    cell(a.PROSTOY, 'mono') + '<td class="mono"><b>' + M.esc(a.COMMON_PROSTOY) + '</b></td>' +
                    cell(a.ALARM_WHO, 'cut') + cell(a.DESC_NOTICE, 'cut') + cell(a.UPDATED_BY || a.CREATED_BY, 'muted') +
                    '</tr>';
            }).join('');
            document.getElementById('foot').innerHTML = '<tr><td colspan="17">Итого: ' + rows.length + ' ' +
                (rows.length % 10 === 1 && rows.length % 100 !== 11 ? 'авария' : 'аварий') +
                (open ? ', не закрыто: ' + open : '') + '</td><td class="mono">' + M.hms(totalSec) + '</td><td colspan="3"></td></tr>';
        }

        function load() {
            M.api('GET', '/alarms?' + query()).then(function (r) { rows = r; render(); })
                .catch(function (e) { M.toast(e.message, 'error'); });
        }

        function openModal(id) {
            M.api('GET', '/alarms/' + id).then(function (a) {
                openedId = id;
                document.getElementById('modal-title').textContent = 'Авария № ' + a.ID + (a.IS_OPEN ? ' · НВ' : '');
                document.getElementById('modal').hidden = false;
                form.ready.then(function () { form.fill(a); });
            });
        }
        function closeModal() { document.getElementById('modal').hidden = true; openedId = null; }

        function fillSelect(id, values) {
            document.getElementById(id).innerHTML = '<option value="">Все</option>' + values.map(function (v) {
                return '<option>' + M.esc(v) + '</option>';
            }).join('');
        }

        if (session) {
            form = AlarmForm.create(document.getElementById('modal-form'), {
                readonly: !M.can('edit'),
                onSaved: function () { closeModal(); load(); },
                onCancel: closeModal
            });
            M.api('GET', '/dicts').then(function (d) {
                fillSelect('napr', d.napr); fillSelect('tehc', d.tehc); fillSelect('type', d.alarm_type);
            });

            document.getElementById('rows').onclick = function (e) {
                var tr = e.target.closest('tr[data-id]');
                if (tr) openModal(tr.getAttribute('data-id'));
            };
            document.getElementById('modal-x').onclick = closeModal;
            document.getElementById('modal').onclick = function (e) { if (e.target.id === 'modal') closeModal(); };
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
            document.getElementById('delete').onclick = function () {
                if (!confirm('Удалить аварию № ' + openedId + ' без возможности восстановления?')) return;
                M.api('DELETE', '/alarms/' + openedId).then(function () {
                    M.toast('Авария удалена'); closeModal(); load();
                }).catch(function (x) { M.toast(x.message, 'error'); });
            };

            Array.prototype.forEach.call(document.querySelectorAll('#quick button'), function (b) {
                b.onclick = function () { setPeriod(b.getAttribute('data-p')); };
            });
            ['from', 'to'].forEach(function (id) {
                document.getElementById(id).onchange = function () { markQuick(''); load(); };
            });
            ['napr', 'tehc', 'type', 'open'].forEach(function (id) { document.getElementById(id).onchange = load; });
            var timer;
            document.getElementById('q').oninput = function () { clearTimeout(timer); timer = setTimeout(load, 300); };

            document.getElementById('csv').onclick = function () {
                var f = document.getElementById('from').value, t = document.getElementById('to').value;
                M.download('/alarms-export.csv?' + query(), 'avarii_' + (f || 'vse') + (t ? '_' + t : '') + '.csv')
                    .then(function () { M.toast('Выгружено строк: ' + rows.length); })
                    .catch(function (e) { M.toast(e.message, 'error'); });
            };

            setPeriod('week');
        }
    </script>
</body>
</html>
