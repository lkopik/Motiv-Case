services:
  #MariaDB
  db:
    image: mariadb:10.1
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: motivchik_qwe
      MYSQL_DATABASE: logs_of_db
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init_scripts:/docker-entrypoint-initdb.d

  #FastAPI
  backend:
    build: ./backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db

  #Фронтенд (Раздача статических HTML/JS файлов)
  frontend:
    image: nginx:alpine
    ports:
      - "82:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    command: /bin/sh -c "echo 'server { listen 80; location / { root /usr/share/nginx/html; } location /api/ { proxy_pass http://backend:8000/api/; } }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    depends_on:
      - backend

volumes:
  mariadb_data:
